# Zero-dependency plugin: the whole job is "parse, test, check the manifest".
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Bundle conformance (manifest, patch, locale, icon, import graph, syntax)
        run: node scripts/check.mjs
      - name: Tests (no network, no harness)
        run: node --test
